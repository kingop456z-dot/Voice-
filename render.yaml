services:
  - type: web
    name: voicemate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste the key in the Render dashboard
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "10"
