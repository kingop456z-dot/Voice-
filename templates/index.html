<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>VoiceMate · AI voice assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-state="idle">
  <div class="shell">
    <header class="top">
      <div class="brand"><span class="mark">V</span>VoiceMate</div>
      <div class="top-right">
        <span class="badge" id="aiBadge">Checking…</span>
        <button class="icon-btn" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <section class="panel" id="settings" hidden>
      <div class="grid">
        <label>Language
          <select id="lang">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="en-IN">English (India)</option>
            <option value="hi-IN">हिन्दी (Hindi)</option>
            <option value="es-ES">Español</option>
            <option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option>
          </select>
        </label>
        <label>Voice
          <select id="voice"><option value="">Automatic</option></select>
        </label>
        <label>Speaking speed <span class="muted" id="rateVal">1.0×</span>
          <input type="range" id="rate" min="0.7" max="1.4" step="0.1" value="1">
        </label>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="autoSpeak"> Speak replies aloud</label>
        <label class="check"><input type="checkbox" id="keepListening"> Keep listening after each reply</label>
      </div>
      <button class="btn" id="clear" type="button">Clear conversation</button>
    </section>

    <main class="chat" id="log" aria-live="polite" aria-label="Conversation">
      <div class="empty" id="empty">
        <h1>Hi, I'm VoiceMate.</h1>
        <p>Tap the microphone and talk to me, or type below.</p>
        <div class="chips">
          <button class="chip" type="button" data-say="What's the time?">What's the time?</button>
          <button class="chip" type="button" data-say="Tell me a joke">Tell me a joke</button>
          <button class="chip" type="button" data-say="What is 12 times 8?">What is 12 times 8?</button>
          <button class="chip" type="button" data-say="Explain black holes in simple words">Explain black holes</button>
        </div>
      </div>
    </main>

    <footer class="dock">
      <p class="support" id="support" hidden>Voice input isn't supported in this browser. Try Chrome, Edge or Safari. You can still type below.</p>
      <div class="controls">
        <button class="mic" id="mic" type="button" aria-label="Talk to VoiceMate" aria-pressed="false">
          <span class="ring"></span>
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
        </button>
        <p class="status" id="status" role="status">Tap the mic and speak</p>
        <button class="btn btn-small" id="stopSpeak" type="button" hidden>Stop speaking</button>
      </div>
      <form class="textbar" id="textForm" autocomplete="off">
        <input id="textInput" type="text" maxlength="500" placeholder="Or type a message…" aria-label="Type a message">
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </footer>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
